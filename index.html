<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusHive AI | Master Your ADHD Focus ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfdff; }
        .ai-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(79, 70, 229, 0.1); }
        .step-entry { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-white to-slate-50">

    <div class="max-w-xl w-full ai-card p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgba(79,70,229,0.1)] text-center">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-3xl shadow-lg shadow-indigo-200 mb-6 rotate-3">
                <span class="text-3xl text-white">⚡</span>
            </div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">FocusHive AI</h1>
            <p class="text-slate-500 font-medium italic">"Because big tasks are just small steps in disguise."</p>
        </div>

        <div class="space-y-5">
            <div class="relative group">
                <input id="taskInput" type="text" 
                       placeholder="What's making you feel stuck?" 
                       class="w-full p-6 bg-white/50 border-2 border-slate-100 rounded-[1.5rem] focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none transition-all text-slate-800 font-semibold text-lg shadow-sm">
            </div>
            
            <button onclick="runAILogic()" id="btn"
                    class="w-full bg-slate-900 hover:bg-black text-white font-extrabold py-6 rounded-[1.5rem] transition-all transform active:scale-[0.97] flex items-center justify-center gap-4 text-xl shadow-xl">
                <span>Slice It Now</span>
                <div id="loadingCircle" class="hidden loader"></div>
            </button>
        </div>

        <div id="resultBox" class="mt-10 space-y-4 text-left">
            </div>

        <div class="mt-12 pt-8 border-t border-slate-100">
            <p class="text-xs font-bold text-indigo-400 uppercase tracking-[0.2em] mb-4">Level up your productivity</p>
            <a href="https://payhip.com/YOUR_STORE" target="_blank" 
               class="inline-block px-8 py-3 bg-indigo-50 text-indigo-700 rounded-full font-extrabold hover:bg-indigo-100 transition-all">
                Check our Ultimate Digital Planner →
            </a>
        </div>
    </div>

    <script>
        async function runAILogic() {
            const input = document.getElementById('taskInput');
            const btn = document.getElementById('btn');
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loadingCircle');

            if (!input.value.trim()) return;

            // Start Loading State
            btn.disabled = true;
            loader.classList.remove('hidden');
            resultBox.innerHTML = "";

            try {
                // هاد هو الساروت ديالك اللي جبتي، دمجتو ليك هنا
                const token = "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";
                const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        inputs: `[INST] You are an ADHD productivity expert. Break the task "${input.value}" into 3 ultra-tiny, easy-to-start steps. Keep it short and supportive. [/INST]`,
                        parameters: { max_new_tokens: 150 }
                    })
                });

                const data = await response.json();
                let fullText = data[0].generated_text;
                let finalSteps = fullText.split('[/INST]')[1] || fullText;

                // تحويل النص لبطاقات أنيقة
                const lines = finalSteps.trim().split('\n').filter(l => l.length > 5).slice(0, 3);
                
                lines.forEach((line, i) => {
                    setTimeout(() => {
                        const div = document.createElement('div');
                        div.className = "step-entry p-5 bg-white border border-indigo-50 rounded-2xl shadow-sm flex items-start gap-4";
                        div.innerHTML = `
                            <span class="flex-shrink-0 w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-sm">${i+1}</span>
                            <p class="text-slate-700 font-semibold leading-relaxed">${line.replace(/^\d+\.\s*/, '')}</p>
                        `;
                        resultBox.appendChild(div);
                    }, i * 300);
                });

            } catch (err) {
                resultBox.innerHTML = "<p class='text-center text-red-400 font-bold uppercase text-xs'>Server busy. Try again in 3 seconds!</p>";
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
