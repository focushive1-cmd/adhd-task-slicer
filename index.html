<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Task Slicer - FocusHive</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; }
        h1 { color: #1a1a1a; font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 90%; padding: 14px; margin-bottom: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #3498db; outline: none; }
        button { background-color: #3498db; color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        #output { margin-top: 20px; text-align: left; background: #f8fbff; padding: 15px; border-radius: 12px; display: none; border-left: 5px solid #3498db; line-height: 1.6; }
        .product-box { margin-top: 25px; border-radius: 15px; overflow: hidden; border: 1px solid #e1e8ed; background: #fff; }
        .product-box img { width: 100%; height: auto; display: block; }
        .product-info { padding: 15px; text-align: center; }
        .product-info h3 { margin: 0 0 8px 0; font-size: 18px; color: #2c3e50; }
        .product-info p { margin: 0; font-size: 13px; color: #7f8c8d; }
        .cta-btn { display: block; background: #f39c12; color: white; text-decoration: none; padding: 16px; font-weight: bold; font-size: 16px; border-radius: 0 0 15px 15px; }
        .footer-stats { margin-top: 30px; font-size: 11px; color: #999; }
        .footer-stats img { margin-top: 8px; filter: grayscale(20%); }
    </style>
</head>
<body>

<div class="card">
    <h1>ADHD Task Slicer ⚡</h1>
    <p class="subtitle">Break big tasks into tiny, manageable steps.</p>
    
    <input type="text" id="taskInput" placeholder="Enter your task (e.g. Study for MPSI)">
    <button onclick="sliceTask()">Slice It Now!</button>

    <div id="output"></div>

    <div class="product-box">
        <img src="https://raw.githubusercontent.com/focushive1-cmd/adhd-task-slicer/main/planner-image.jpg" 
             onerror="this.src='https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=500'" 
             alt="FocusHive Planner">
        <div class="product-info">
            <h3>Master Your Routine 📅</h3>
            <p>Ready to stay consistent? Get our Ultimate Digital Planner Pack today.</p>
        </div>
        <a href="https://payhip.com/FocusHive1" class="cta-btn">SHOP THE PLANNER - 50% OFF</a>
    </div>

    <div class="footer-stats">
        <p>LIVE VISITOR COUNT</p>
        <img src="https://count.getloli.com/get/@focushive1-slicer?theme=rule34" alt="Visitor Counter">
    </div>
</div>

<script>
function sliceTask() {
    let task = document.getElementById('taskInput').value;
    if(!task) return;
    let result = document.getElementById('output');
    result.style.display = 'block';
    
    result.innerHTML = `
        <strong>Steps to crush "${task}":</strong>
        <ol>
            <li>Start with just 5 minutes of focused work.</li>
            <li>Identify the first 3 sub-tasks.</li>
            <li>Take a 2-minute break after each one.</li>
            <li><strong>Check your FocusHive Planner</strong> to stay on track!</li>
        </ol>
    `;
}
</script>

</body>
</html>
