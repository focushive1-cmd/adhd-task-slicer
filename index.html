<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusHive AI | Slice Task Paralysis ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfdff; }
        .ai-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); }
        .step-entry { animation: fadeInUp 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 22px; height: 22px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-white to-slate-100">

    <div class="max-w-xl w-full ai-card p-10 rounded-[2.5rem] shadow-2xl border border-white">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-3xl shadow-xl shadow-indigo-200 mb-6">
                <span class="text-3xl text-white">⚡</span>
            </div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">FocusHive AI</h1>
            <p class="text-slate-500 font-medium italic">Turning ADHD paralysis into easy wins.</p>
        </div>

        <div class="space-y-4">
            <input id="taskInput" type="text" placeholder="What's a task you're avoiding?" 
                   class="w-full p-6 bg-white border-2 border-slate-100 rounded-[1.5rem] focus:border-indigo-500 outline-none transition-all text-slate-800 font-semibold shadow-sm text-lg">
            
            <button onclick="sliceItNow()" id="btn"
                    class="w-full bg-slate-900 hover:bg-black text-white font-extrabold py-6 rounded-[1.5rem] transition-all active:scale-[0.98] flex items-center justify-center gap-4 text-xl shadow-xl">
                <span>Slice It Now</span>
                <div id="loadingCircle" class="hidden loader"></div>
            </button>
        </div>

        <div id="resultBox" class="mt-10 space-y-4"></div>

        <div class="mt-12 pt-8 border-t border-slate-100 text-center text-sm">
            <a href="https://payhip.com/FocusHive1" target="_blank" class="text-indigo-600 font-extrabold hover:underline">
                Get the Ultimate Digital Planner →
            </a>
        </div>
    </div>

    <script>
        async function sliceItNow() {
            const input = document.getElementById('taskInput').value;
            const btn = document.getElementById('btn');
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loadingCircle');

            if (!input.trim()) return;

            // كنبداو التحميل
            btn.disabled = true;
            loader.classList.remove('hidden');
            resultBox.innerHTML = "";

            try {
                // هاد الـ API ما كيحتاج لا ساروت لا والو، وخدام ديما بالزربة
                const prompt = `You are an ADHD productivity coach. Break the task "${input}" into 3 very short, extremely easy, actionable steps. Return ONLY a numbered list (1., 2., 3.). No intro, no outro.`;
                const encodedPrompt = encodeURIComponent(prompt);
                
                const response = await fetch(`https://text.pollinations.ai/${encodedPrompt}`);
                
                if (!response.ok) throw new Error("Network response was not ok");
                
                const text = await response.text();
                
                // تنظيف وعرض النتائج
                const steps = text.trim().split('\n').filter(s => s.length > 5).slice(0, 3);
                
                steps.forEach((step, i) => {
                    setTimeout(() => {
                        const div = document.createElement('div');
                        div.className = "step-entry p-5 bg-indigo-50/50 rounded-2xl border border-indigo-100 text-slate-800 font-bold shadow-sm flex items-center gap-4";
                        div.innerHTML = `<span class="bg-indigo-600 text-white w-8 h-8 rounded-xl flex items-center justify-center text-sm flex-shrink-0">${i+1}</span> <p>${step.replace(/^\d+[\.\)]\s*/, '')}</p>`;
                        resultBox.appendChild(div);
                    }, i * 200);
                });

            } catch (err) {
                resultBox.innerHTML = "<p class='text-center text-red-500 font-bold'>Oops! The AI blinked. Try clicking again.</p>";
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
