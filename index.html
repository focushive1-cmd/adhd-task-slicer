<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Task Slicer - FocusHive</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        h1 { color: #2c3e50; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 18px; }
        #output { margin-top: 20px; text-align: left; background: #e8f4fd; padding: 15px; border-radius: 8px; display: none; border-left: 5px solid #3498db; }
        .product-box { margin-top: 30px; border: 2px solid #3498db; border-radius: 12px; overflow: hidden; background: #fff; }
        .product-box img { width: 100%; height: auto; display: block; min-height: 200px; background: #eee; }
        .cta-btn { display: block; background: #e67e22; color: white; text-decoration: none; padding: 15px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="card">
    <h1>ADHD Task Slicer ⚡</h1>
    <p>Break your big tasks into tiny, manageable steps.</p>
    <input type="text" id="taskInput" placeholder="Enter your task (e.g. Study for MPSI)">
    <button onclick="sliceTask()">Slice It Now!</button>

    <div id="output"></div>

    <div class="product-box">
        <img src="https://raw.githubusercontent.com/focushive1-cmd/adhd-task-slicer/main/planner-image.jpg" onerror="this.src='https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&q=80&w=500'" alt="Digital Planner Pack">
        <div style="padding: 15px;">
            <h3>Master Your Routine 📅</h3>
            <p>Ready to stay consistent? Get our Ultimate Digital Planner Pack today.</p>
        </div>
        <a href="https://payhip.com/FocusHive1" class="cta-btn">SHOP THE PLANNER - 50% OFF</a>
    </div>
</div>

<script>
function sliceTask() {
    let task = document.getElementById('taskInput').value;
    if(!task) return;
    let result = document.getElementById('output');
    result.style.display = 'block';
    result.innerHTML = "<strong>Steps to crush " + task + ":</strong><ol><li>Set a 5-minute timer.</li><li>Do the smallest piece first.</li><li>Check your FocusHive Planner!</li></ol>";
}
</script>

</body>
</html>
